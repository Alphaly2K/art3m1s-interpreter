[package]
name = "asb-interpreter"
version = "0.1.0"
edition = "2024"

[dependencies]
asb-decrypt = { path = "../asb-decrypt" }
mlua = { version = "0.10", features = ["lua51", "send", "serialize", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
thiserror = "2.0"